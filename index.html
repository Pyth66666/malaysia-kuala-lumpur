import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ================= renderer =================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();

// ================= day / night rigs =================
const DAY = {
  bg: new THREE.Color(0x9db8dd), fogC: new THREE.Color(0xa8bcdc),
  sunI: 2.2, ambI: 0.45, hemiI: 0.5, expo: 0.85

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x9a9a90, DAY.hemiI + 0.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1da, DAY.sunI);
sun.position.set(-500, 1100, 350); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-1600, right:1600, top:1600, bottom:-1600, far:4000});

let night = false;
const moonLight = new THREE.DirectionalLight(0x8ea4d4, 0.0);

function setNight(on){

  scene.background.copy(P.bg); scene.fog.color.copy(P.fogC);
  scene.fog.near = on ? 900 : 1500; scene.fog.far = on ? 5200 : 6500;
  sun.intensity = P.sunI; ambient.intensity = P.ambI; hemi.intensity = P.hemiI;
  moonLight.intensity = on ? 0.55 : 0.0;
  renderer.toneMappingExposure = P.expo;
  skyMat.uniforms.uNight.value = on ? 1.0 : 0.0;
  cloudGroup.visible = !on;
  winMats.forEach(m => { m.emissiveIntensity = on ? 1.4 : 0.0; });
  streetLights.forEach(g => {
    g.children.forEach(ch => { if (ch.material && ch.material.emissive) ch.material.emissiveIntensity = on ? 1.6 : 0; });
  });
  carMats.forEach(m => m.emissiveIntensity = on ? 0.8 : 0.0);
  if (typeof headlightMat !== 'undefined'){
    headlightMat.emissiveIntensity = on ? 2.0 : 0.0;
    taillightMat.emissiveIntensity = on ? 1.5 : 0.0;
  }
}
renderer.toneMappingExposure = DAY.expo;

// ================= procedural window textures =================
function windowTexture(litChance, nightMode = false){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  // day map: light facade base; night emissive map: black so only windows glow
  g.fillStyle = nightMode ? '#000000' : '#ffffff';
  g.fillRect(0, 0, 256, 256);
  for (let y = 6; y < 252; y += 14){
    for (let x = 5; x < 252; x += 10){
      const r = Math.random();
      if (nightMode){
        // only lit windows emit; everything else black
        if (r < litChance) g.fillStyle = `rgba(255,${200 + Math.random()*40|0},${140 + Math.random()*60|0},${0.75 + Math.random()*0.25})`;
        else g.fillStyle = '#000000';
      } else {
        if (r < litChance) g.fillStyle = '#fff3cf';          // lit window
        else if (r < litChance + 0.45) g.fillStyle = '#dcecf8'; // bright sky glass
        else g.fillStyle = '#8fa2b2';                         // reflective glass
      }
      g.fillRect(x, y, 7, 9);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = nightMode ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  return t;
}
const dayTex   = windowTexture(0.0);        // unlit day windows
const nightTex = windowTexture(0.22, true); // emissive: black bg, lit windows only

// ---- environment map: gradient sky + ground, gives mirror-glass reflections ----
function skyEnvMap(){
  const c = document.createElement('canvas');
  c.width = 64; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, '#2e5ea8');   // zenith blue
  grad.addColorStop(0.45, '#9db8dd');  // horizon
  grad.addColorStop(0.5, '#d8cfc0');   // haze line
  grad.addColorStop(0.6, '#8e8a7c');   // city ground
  grad.addColorStop(1.0, '#55534a');   // below
  g.fillStyle = grad; g.fillRect(0, 0, 64, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const envMap = skyEnvMap();
scene.environment = envMap;

// ---- asphalt texture for roads ----
function asphaltTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#3d3f43'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++){  // asphalt speckle
    const v = 40 + Math.random() * 45;
    g.fillStyle = `rgba(${v},${v},${v+4},${0.35 + Math.random()*0.3})`;
    g.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
  // faint tire wear bands
  g.fillStyle = 'rgba(30,30,32,0.25)';
  g.fillRect(40, 0, 60, 256); g.fillRect(160, 0, 60, 256);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const asphaltTex = asphaltTexture();

// ---- grass texture ----
function grassTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#4d8c3f'; g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 1400; i++){
    const shade = 50 + Math.random() * 40;
    g.strokeStyle = `rgba(${shade*0.5},${shade+30},${shade*0.45},0.5)`;
    const x = Math.random()*128, y = Math.random()*128;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random()-0.5)*4, y - 3 - Math.random()*4); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(40, 40);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// tall glass towers & warm low-rise share emissive map trick:
const winMats = [];
function facadeMaterial(isGlass, hMeters){
  const t = dayTex.clone(); t.needsUpdate = true;
  t.repeat.set(1, 1);
  const m = new THREE.MeshStandardMaterial({
    map: t,
    emissiveMap: nightTex.clone(), emissive: 0xffdf9e, emissiveIntensity: 0.0,
    color: isGlass ? 0xcfe0ee : 0xe8e0d2,
    roughness: isGlass ? 0.12 : 0.85,   // near-mirror glass
    metalness: isGlass ? 0.9 : 0.05,    // metallic so envMap reflects
    envMap: envMap,
    envMapIntensity: isGlass ? 1.4 : 0.3,
    vertexColors: false
  });
  m.emissiveMap.needsUpdate = true;
  m.emissiveMap.wrapS = m.emissiveMap.wrapT = THREE.RepeatWrapping;
  m.emissiveMap.repeat.copy(t.repeat);
  winMats.push(m);
  return m;
}
// palette → material cache keyed by rounded height + type
const matCache = new Map();
function facadeFor(isGlass, h){
  const key = (isGlass?'G':'W') + Math.round(h/10);
  if (!matCache.has(key)) matCache.set(key, facadeMaterial(isGlass, h));
  return matCache.get(key);
}

// ================= load city =================
const res = await fetch('./data/kl_scene.json');
const s = await res.json();
const city = new THREE.Group(); city.name = 'KualaLumpur';

// --- buildings: per-triangle color buffer groups tall/short via heuristic ---
// We rebuild two meshes: glass (tall) and warm (short), using color brightness as classifier
// and attach facade textures. Simpler & robust: keep vertexColors base + overlay windows via
// a second transparent emissive-only mesh using the same geometry with UVs projected from height.
function addUVsByHeight(geo){
  const pos = geo.getAttribute('position');
  const uv = new Float32Array((pos.count) * 2);
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    // facade UV: one texture tile spans ~18 floors and ~24 window columns
    uv[i*2]   = (x + z) / 60;
    uv[i*2+1] = y / (3.2 * 18);
  }
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}

// split buildings into tall-glass vs short-warm by scanning vertex colors (blue-ish = glass)
const tallIdx = [], shortIdx = [];
{
  const pos = s.buildings, col = s.buildings_c, triCount = col.length/9;
  // classification per triangle: majority blue channel > red channel → glass
  for (let t = 0; t < triCount; t++){
    const r = col[t*9], b = col[t*9+2];
    (b >= r ? tallIdx : shortIdx).push(t);
  }
}
function buildSubset(idxs, useTex){
  const n = idxs.length * 9;
  const p = new Float32Array(n), c = new Float32Array(n);
  let k = 0;
  for (const t of idxs){
    for (let j = 0; j < 9; j++, k++){
      p[k] = s.buildings[t*9+j];
      c[k] = s.buildings_c[t*9+j];
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  g.computeVertexNormals();
  if (useTex) addUVsByHeight(g);
  return g;
}
const tallGeo = buildSubset(tallIdx, true);
const shortGeo = buildSubset(shortIdx, true);
const tallMat = facadeFor(true, 60);   // glass texture scale
const shortMat = facadeFor(false, 15); // warm texture scale
const tallMesh = new THREE.Mesh(tallGeo, tallMat);
const shortMesh = new THREE.Mesh(shortGeo, shortMat);
tallMesh.castShadow = tallMesh.receiveShadow = true;
shortMesh.castShadow = shortMesh.receiveShadow = true;
city.add(tallMesh, shortMesh);

// --- roads ---
const roadGeo = new THREE.BufferGeometry();
roadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(s.roads), 3));
roadGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(s.roads_c), 3));
roadGeo.computeVertexNormals();
// asphalt UVs: scale texture to real meters (one tile = 8 m)
{
  const pos = roadGeo.getAttribute('position');
  const uv = new Float32Array(pos.count * 2);
  for (let i = 0; i < pos.count; i++){
    uv[i*2]   = pos.getX(i) / 8;
    uv[i*2+1] = pos.getZ(i) / 8;
  }
  roadGeo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
}
asphaltTex.repeat.set(1, 1);
const roadMesh = new THREE.Mesh(roadGeo, new THREE.MeshStandardMaterial({map: asphaltTex, roughness:0.9, metalness:0.0, side:THREE.DoubleSide}));
roadMesh.receiveShadow = true;
city.add(roadMesh);

// road markings: dashed center lines on major roads (proper width quads)
const markVerts = [];
for (const pts of s.centers){
  for (let i = 0; i < pts.length - 2; i += 2){
    const x1 = pts[i], y1 = pts[i+1], x2 = pts[i+2], y2 = pts[i+3];
    const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx, dy);
    if (L < 1) continue;
    const nx = -dy/L * 0.18, ny = dx/L * 0.18; // half-width 18 cm
    const n = Math.floor(L / 12);
    for (let k = 0; k < n; k += 2){
      const t0 = k/n, t1 = Math.min(1, (k+0.6)/n);
      const ax1 = x1+dx*t0+nx, ay1 = y1+dy*t0+ny, bx1 = x1+dx*t1+nx, by1 = y1+dy*t1+ny;
      const ax2 = x1+dx*t0-nx, ay2 = y1+dy*t0-ny, bx2 = x1+dx*t1-nx, by2 = y1+dy*t1-ny;
      markVerts.push(ax1, 0.12, -ay1, bx1, 0.12, -by1, bx2, 0.12, -by2);
      markVerts.push(ax1, 0.12, -ay1, bx2, 0.12, -by2, ax2, 0.12, -ay2);
    }
  }
}
const markGeo = new THREE.BufferGeometry();
markGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(markVerts), 3));
const markMesh = new THREE.Mesh(markGeo, new THREE.MeshBasicMaterial({color:0xf0e6a8, side:THREE.DoubleSide}));
city.add(markMesh);

// --- water & green ---
const waterGeo = new THREE.BufferGeometry();
waterGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(s.water), 3));
waterGeo.computeVertexNormals();
const waterMesh = new THREE.Mesh(waterGeo, new THREE.MeshStandardMaterial({color:0x2e6ea8, roughness:0.12, metalness:0.6, side:THREE.DoubleSide}));
waterMesh.position.y = 0.62;  // converter emits water at y=-0.6; lift above ground (-0.08)
city.add(waterMesh);

const greenGeo = new THREE.BufferGeometry();
greenGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(s.green), 3));
greenGeo.computeVertexNormals();
const greenMesh = new THREE.Mesh(greenGeo, new THREE.MeshStandardMaterial({map: grassTexture(), roughness:0.95, side:THREE.DoubleSide}));
greenMesh.receiveShadow = true;
city.add(greenMesh);

// ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000),
  new THREE.MeshStandardMaterial({color:0xb8b4a8, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.08; ground.receiveShadow = true;
city.add(ground);

// ================= trees (instanced) =================
// scatter 2500 trees inside green polygons' bounding areas (cheap: random over green tri bboxes)
function scatterTrees(){
  const pos = s.green; if (!pos.length) return [];
  const trees = [];
  for (let i = 0; i < 22000 && trees.length < 2600; i++){
    const t = Math.floor(Math.random() * (pos.length/9));
    // random barycentric point in triangle t
    const o = t*9;
    const ax=pos[o],ay=pos[o+1],az=pos[o+2], bx=pos[o+3],by=pos[o+4],bz=pos[o+5], cx=pos[o+6],cy=pos[o+7],cz=pos[o+8];
    let u = Math.random(), v = Math.random();
    if (u+v > 1){ u = 1-u; v = 1-v; }
    trees.push([ax+u*(bx-ax)+v*(cx-ax), 0.05, az+u*(bz-az)+v*(cz-az)]);
  }
  return trees;
}
const treePts = scatterTrees();
if (treePts.length){
  const trunkGeo = new THREE.CylinderGeometry(0.22, 0.38, 3.2, 6);
  const trunkMat = new THREE.MeshStandardMaterial({color:0x5f4326, roughness:1});
  // canopy: two stacked irregular spheres with per-tree color variation
  const crownGeo = new THREE.IcosahedronGeometry(2.0, 1);
  // distort canopy vertices for organic look
  {
    const p = crownGeo.getAttribute('position');
    for (let i = 0; i < p.count; i++){
      const n = 1 + (Math.sin(i*12.9898)*43758.5453 % 1) * 0.35;
      p.setXYZ(i, p.getX(i)*n, p.getY(i)*n*0.8, p.getZ(i)*n);
    }
    crownGeo.computeVertexNormals();
  }
  const crownMats = [0x2e7d3a, 0x3a9142, 0x276e31, 0x4a9e3f].map(c =>
    new THREE.MeshStandardMaterial({color:c, roughness:0.95, flatShading:true}));
  const ti = new THREE.InstancedMesh(trunkGeo, trunkMat, treePts.length);
  const ci = new THREE.InstancedMesh(crownGeo, crownMats[0], treePts.length);
  ci.castShadow = true;
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), S = new THREE.Vector3();
  const color = new THREE.Color();
  treePts.forEach((p, i) => {
    const sc = 0.8 + Math.random()*0.9;
    M.compose(V.set(p[0], p[1]+1.6*sc, p[2]), Q, S.set(sc, sc, sc)); ti.setMatrixAt(i, M);
    M.compose(V.set(p[0], p[1]+3.8*sc, p[2]), Q, S.set(sc, sc*1.1, sc)); ci.setMatrixAt(i, M);
    ci.setColorAt(i, color.set(crownMats[i % crownMats.length].color));
  });
  city.add(ti, ci);
}

// ================= traffic (detailed cars: body + cabin + wheels + lights) =================
const carMats = [];
const cars = [];
const carParent = new THREE.Group(); carParent.name = 'Traffic';
const MAX_CARS = 200;
const carColors = [0xd8dade, 0x2c2f36, 0xb0b4bc, 0x8c1f28, 0x24405e, 0xc7a94e, 0x3a5f3a, 0x7c4a9e];
const wheelGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.22, 10);
const wheelMat = new THREE.MeshStandardMaterial({color:0x141416, roughness:0.9});
const glassMat = new THREE.MeshStandardMaterial({color:0x9db8cc, roughness:0.1, metalness:0.8, envMap, envMapIntensity:1.2});
const headlightMat = new THREE.MeshStandardMaterial({color:0xfff6d8, emissive:0xffeebb, emissiveIntensity:0});
const taillightMat = new THREE.MeshStandardMaterial({color:0x55080a, emissive:0xff2a1a, emissiveIntensity:0});

function makeCar(color){
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({color, roughness:0.35, metalness:0.7, envMap, envMapIntensity:0.9});
  carMats.push(bodyMat);
  // main body: tapered lower + rounded cabin
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.65, 4.3), bodyMat);
  body.position.y = 0.72; body.castShadow = true; g.add(body);
  const hood = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 1.3), bodyMat);
  hood.position.set(0, 1.08, -1.35); g.add(hood);
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 1.1), bodyMat);
  trunk.position.set(0, 1.08, 1.5); g.add(trunk);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.62, 2.2), bodyMat);
  cabin.position.set(0, 1.55, 0.15); g.add(cabin);
  // windshield + rear glass
  const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 0.08), glassMat);
  windshield.position.set(0, 1.5, -0.95); windshield.rotation.x = -0.45; g.add(windshield);
  const rear = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.45, 0.08), glassMat);
  rear.position.set(0, 1.52, 1.25); rear.rotation.x = 0.4; g.add(rear);
  // wheels
  for (const [wx, wz] of [[-0.85, -1.4], [0.85, -1.4], [-0.85, 1.4], [0.85, 1.4]]){
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(wx, 0.34, wz);
    g.add(w);
  }
  // head & tail lights
  for (const hx of [-0.6, 0.6]){
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.06), headlightMat);
    hl.position.set(hx, 0.85, -2.16); g.add(hl);
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.14, 0.06), taillightMat);
    tl.position.set(hx, 0.9, 2.16); g.add(tl);
  }
  return g;
}

const roadPaths = s.centers.map(pts => {
  const v = [];
  for (let i = 0; i < pts.length; i += 2) v.push(new THREE.Vector3(pts[i], 0.22, -pts[i+1]));  // wheel bottoms (0.34-0.12) sit on road (y=0.1)
  // cumulative lengths
  const seg = []; let total = 0;
  for (let i = 0; i < v.length-1; i++){
    const L = v[i].distanceTo(v[i+1]); seg.push(L); total += L;
  }
  return {v, seg, total};
}).filter(p => p.total > 120);

for (let i = 0; i < MAX_CARS && roadPaths.length; i++){
  const path = roadPaths[i % roadPaths.length];
  const mesh = makeCar(carColors[i % carColors.length]);
  const dir = (i % 2) * 2 - 1; // both directions
  const offset = (i % 4 < 2 ? 3.5 : -3.5);
  cars.push({mesh, path, t: Math.random(), speed: (16 + Math.random()*14) / Math.max(200, path.total), dir, offset});
  carParent.add(mesh);
}
city.add(carParent);
function posOnPath(path, t, out){
  const d = t * path.total;
  let acc = 0;
  for (let i = 0; i < path.seg.length; i++){
    if (acc + path.seg[i] >= d){
      const f = (d - acc) / path.seg[i];
      out.lerpVectors(path.v[i], path.v[i+1], f);
      return out;
    }
    acc += path.seg[i];
  }
  out.copy(path.v[path.v.length-1]);

}
const _p = new THREE.Vector3(), _p2 = new THREE.Vector3();
function updateCars(dt){
  for (const c of cars){

    let t = c.t, look = (c.t + 0.001) % 1, dirSign = 1;
    if (c.dir < 0){ t = 1 - t; look = (t - 0.001 + 1) % 1; }
    posOnPath(c.path, t, _p);
    posOnPath(c.path, look, _p2);
    const dx = _p2.x - _p.x, dz = _p2.z - _p.z;
    const L = Math.hypot(dx, dz) || 1;
    // lane offset flips with travel direction so opposing traffic keeps left
    const lane = c.offset * (c.dir < 0 ? -1 : 1);
    c.mesh.position.set(_p.x - dz/L*lane, _p.y, _p.z + dx/L*lane);
    c.mesh.lookAt(_p2.x, _p2.y, _p2.z);
  }
}

const _tp = new THREE.Vector3(), _tp2 = new THREE.Vector3();
function posOnPolyline(v, seg, total, t, out){
  const d = t * total;
  let acc = 0;
  for (let i = 0; i < seg.length; i++){
    if (acc + seg[i] >= d){
      out.lerpVectors(v[i], v[i+1], (d-acc)/seg[i]);
      return out;
    }
    acc += seg[i];
  }
  out.copy(v[v.length-1]);
  return out;
}

    posOnPolyline(tr.path.v, tr.path.seg, tr.path.total, (tr.t + 0.002) % 1, _tp2);

      if (uNight > 0.5 && vDir.y > 0.02){
        vec3 cell = floor(vDir * 420.0);
        float s = hash(cell);
        if (s > 0.9975){
          float tw = 0.6 + 0.4 * hash(cell + 1.0);

// ================= real physics: gravity, jump, collision =================
// Building colliders: axis-aligned boxes sampled from building triangles at load.
// We sample ground height + walls from a coarse grid derived from the building data.
const GRAVITY = 9.81 * 2.2;   // slightly heavy = arcade feel
const PLAYER_R = 0.45;        // body radius
const EYE = 1.7;
let vy = 0, onGround = true, groundY = 0;
// collision grid: cell = 8 m, stores max building height per cell (walls) + ground
const CGRID = 8, CGRID_HALF = 3200;
const ccols = Math.ceil(2*CGRID_HALF / CGRID);
const cgrid = new Float32Array(ccols * ccols); // building height per cell (0 = no building)
{
  const pos = s.buildings;
  for (let i = 0; i < pos.length; i += 9){
    for (let v = 0; v < 3; v++){
      const x = pos[i + v*3], y = pos[i + v*3 + 1], z = pos[i + v*3 + 2];
      if (y < 2) continue;  // skip ground vertices
      const cx = Math.floor((x + CGRID_HALF) / CGRID);
      const cz = Math.floor((z + CGRID_HALF) / CGRID);
      if (cx < 0 || cz < 0 || cx >= ccols || cz >= ccols) continue;
      const idx = cz * ccols + cx;
      if (y > cgrid[idx]) cgrid[idx] = y;
    }
  }
}
function buildingHeightAt(x, z){
  const cx = Math.floor((x + CGRID_HALF) / CGRID);
  const cz = Math.floor((z + CGRID_HALF) / CGRID);
  if (cx < 0 || cz < 0 || cx >= ccols || cz >= ccols) return 0;
  return cgrid[cz * ccols + cx];
}
addEventListener('keydown', e => {

});

function move(dt, g = {mx:0, mz:0, my:0}){
  const sprint = keys.ShiftLeft || keys.ShiftRight || gpSprint;
  const speed = (fly ? baseSpeed : (sprint ? 9.5 : 4.2));  // real human speeds: 4.2 walk / 9.5 run
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  _dir.set(0,0,0);
  if (keys.KeyW) _dir.add(fwd);
  if (keys.KeyS) _dir.sub(fwd);
  if (keys.KeyD) _dir.add(right);
  if (keys.KeyA) _dir.sub(right);
  _dir.addScaledVector(fwd, -g.mz);
  _dir.addScaledVector(right, g.mx);
  if (fly) _dir.y += (keys.Space?1:0) - (keys.KeyC?1:0) + g.my;
  if (_dir.lengthSq() > 0){
    _dir.normalize().multiplyScalar(speed*dt);
    // collision: try X and Z separately (slide along walls)
    if (fly){
      cam.position.add(_dir);
    } else {
      const nx = cam.position.x + _dir.x, nz = cam.position.z + _dir.z;
      // wall check: sample at player radius around next position
      const blockedAt = (px, pz) => {
        // check 4 sample points around the circle
        for (const [ox, oz] of [[PLAYER_R,0],[-PLAYER_R,0],[0,PLAYER_R],[0,-PLAYER_R]]){
          if (buildingHeightAt(px+ox, pz+oz) > 2.2) return true;  // inside a building wall zone
        }
        return false;
      };
      let moveX = _dir.x, moveZ = _dir.z;
      if (blockedAt(cam.position.x + moveX, cam.position.z)){
        moveX = 0;   // blocked horizontally → slide
      }
      if (blockedAt(cam.position.x + moveX, cam.position.z + moveZ)){
        moveZ = 0;
      }
      cam.position.x += moveX;
      cam.position.z += moveZ;
    }
  }
  if (!fly){
    // gravity + ground: stand on street (0.15) or land on building roofs
    vy -= GRAVITY * dt;
    cam.position.y += vy * dt;
    const bh = buildingHeightAt(cam.position.x, cam.position.z);
    // ground level: street, or roof top if we are above/at the roof
    const floorY = (bh > 2.2 && cam.position.y >= bh + EYE - 0.5) ? bh + EYE : 0.15;
    if (cam.position.y <= floorY && vy <= 0){
      cam.position.y = floorY;
      vy = 0; onGround = true;
    } else {
      onGround = false;
    }
    cam.position.x = THREE.MathUtils.clamp(cam.position.x,-2600,2600);
    cam.position.z = THREE.MathUtils.clamp(cam.position.z,-2600,2600);
  }
}

// ================= gamepad support =================
// Left stick = move, right stick = 360 look, RT/LT = rise/sink,
// A (0) = sprint hold, Y (3) = toggle day/night, X (2) = toggle walk/fly
let gpSprint = false;
function pollGamepad(dt){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = pads && pads[0];
  if (!gp) return {mx:0, mz:0, my:0};
  const dz = v => Math.abs(v) < 0.18 ? 0 : v; // deadzone
  // right stick → look (360)
  const rx = dz(gp.axes[2] || 0), ry = dz(gp.axes[3] || 0);
  if (rx || ry){
    yaw   -= rx * 3.0 * dt;
    pitch -= ry * 2.2 * dt;
    pitch = THREE.MathUtils.clamp(pitch, -Math.PI/2+0.05, Math.PI/2-0.05);
    applyLook();
  }
  // buttons
  gpSprint = gp.buttons[0] && gp.buttons[0].pressed;             // A = sprint
  if (gp.buttons[3] && gp.buttons[3].pressed && !gp._y){ setNight(!night); modeEl.textContent = (night?'NIGHT ':'DAY ') + (fly?'· FLY':'· WALK'); }
  gp._y = gp.buttons[3] && gp.buttons[3].pressed;
  if (gp.buttons[2] && gp.buttons[2].pressed && !gp._x){
    fly = !fly;
    if (!fly){
      vy = 0; onGround = false;
      const bh = buildingHeightAt(cam.position.x, cam.position.z);
      if (bh > 2.2 && cam.position.y < bh + EYE){ cam.position.y = bh + EYE + 0.1; onGround = true; }
    }
    modeEl.textContent = (night?'NIGHT ':'DAY ') + (fly?'· FLY':'· WALK');
  }
  gp._x = gp.buttons[2] && gp.buttons[2].pressed;
  // triggers: rise / sink
  const rt = gp.buttons[7] ? gp.buttons[7].value : 0;
  const lt = gp.buttons[6] ? gp.buttons[6].value : 0;
  return { mx: dz(gp.axes[0] || 0), mz: dz(gp.axes[1] || 0), my: rt - lt };
}

const mapC = document.createElement('canvas');

// world→map scale: world spans ±3200 m → 1024 px
const MAP_HALF = 3200;
const w2m = (wx, wz) => [ (wx + MAP_HALF) / (2*MAP_HALF) * 1024, (wz + MAP_HALF) / (2*MAP_HALF) * 1024 ];
{
  const g = mapC.getContext('2d');
  g.fillStyle = '#26262b'; g.fillRect(0, 0, 1024, 1024);           // ground
  // parks (green polygons)
  g.fillStyle = '#2e5c2e';
  for (let i = 0; i < s.green.length; i += 9){
    g.beginPath();
    for (let v = 0; v < 3; v++){
      const [mx, my] = w2m(s.green[i+v*3], s.green[i+v*3+2]);
      v === 0 ? g.moveTo(mx, my) : g.lineTo(mx, my);
    }
    g.closePath(); g.fill();
  }
  // water
  g.fillStyle = '#274a75';
  for (let i = 0; i < s.water.length; i += 9){
    g.beginPath();
    for (let v = 0; v < 3; v++){
      const [mx, my] = w2m(s.water[i+v*3], s.water[i+v*3+2]);
      v === 0 ? g.moveTo(mx, my) : g.lineTo(mx, my);
    }
    g.closePath(); g.fill();
  }
  // roads
  g.strokeStyle = '#55555c'; g.lineWidth = 2;
  for (let i = 0; i < s.roads.length; i += 18){   // per quad: 2 triangles = 18 floats
    const [ax, ay] = w2m(s.roads[i], s.roads[i+2]);
    const [bx, by] = w2m(s.roads[i+3], s.roads[i+5]);
    g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
  }
  // buildings (footprints via roof triangles)
  g.fillStyle = '#8f9098';
  for (let i = 0; i < s.buildings.length; i += 9){
    // roof triangles: last 3 vertices have y == height; approximate footprint by first tri
    const y0 = s.buildings[i+1], y1 = s.buildings[i+4], y2 = s.buildings[i+7];
    if (y0 !== y1 || y1 !== y2) continue; // skip wall tris
    g.beginPath();
    for (let v = 0; v < 3; v++){
      const [mx, my] = w2m(s.buildings[i+v*3], s.buildings[i+v*3+2]);
      v === 0 ? g.moveTo(mx, my) : g.lineTo(mx, my);
    }
    g.closePath(); g.fill();
  }
}

  mg.save();
  mg.translate(mini.width/2, mini.height/2);
  mg.fillStyle = '#ff3b3b';
  mg.beginPath();
  mg.moveTo(0, -9); mg.lineTo(6, 7); mg.lineTo(0, 4); mg.lineTo(-6, 7);
  mg.closePath(); mg.fill();
  mg.restore();
  // north indicator
  const na = -yaw + Math.PI;
  const nx = mini.width/2 + Math.sin(na + Math.PI) * (mini.width/2 - 14) * -1;
  const ny = mini.height/2 + Math.cos(na + Math.PI) * (mini.height/2 - 14) * -1;
  mg.fillStyle = '#cfd6e4'; mg.font = 'bold 12px system-ui';
  mg.fillText('N', nx - 4, ny + 4);
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = clock.elapsedTime;
  // drift clouds
  if (cloudGroup.visible){
    for (const c of cloudGroup.children){
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 5000) c.position.x = -5000;
    }
  }
  updateBirds(t, dt);
  updateAirplane(dt);
  arrowLook(dt);
  const g = pollGamepad(dt);
  move(dt, g);
  updateCars(dt);
  updateBuses(dt);
  updateTrains(dt);
  drawMinimap();
  renderer.render(scene, camera);
});
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
