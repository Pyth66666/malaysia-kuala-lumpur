<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KL 3D — Landmark Lab</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:system-ui,sans-serif}
  #ui{position:fixed;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
  #ui button{background:rgba(10,15,35,.75);color:#e4ecff;border:1px solid #3a5f9e;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
  #ui button.on{background:#2a4f8f}
  #info{position:fixed;bottom:10px;left:12px;color:#cfd6e4;font-size:12px;background:rgba(10,15,35,.6);padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<div id="ui"></div>
<div id="info">Drag to orbit · scroll to zoom · N day/night</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { buildPetronas, PETRONAS } from './landmarks/petronas.js';
import { buildMerdeka, MERDEKA } from './landmarks/merdeka.js';
import { buildKLTower } from './landmarks/kltower.js';
import { buildMerdeka118 } from './landmarks/merdeka118.js';
import { buildJamek } from './landmarks/jamek.js';
import { buildX106 } from './landmarks/x106.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.55;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// physical sky + image-based lighting generated from it (so glass reflects the real sky)
const sky = new Sky(); sky.scale.setScalar(15000); scene.add(sky);
const su = sky.material.uniforms;
su.turbidity.value = 6; su.rayleigh.value = 1.4; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.8;
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - 38), THREE.MathUtils.degToRad(-130));
su.sunPosition.value.copy(sunDir);
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); const skyClone = new Sky(); skyClone.scale.setScalar(15000);
skyClone.material.uniforms.sunPosition.value.copy(sunDir);
for (const k of ['turbidity', 'rayleigh', 'mieCoefficient', 'mieDirectionalG']) skyClone.material.uniforms[k].value = su[k].value;
envScene.add(skyClone);
// a city-coloured ground half in the env so glass reflects "street", not void
const gnd = new THREE.Mesh(new THREE.SphereGeometry(14000, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x4a4b47, side: THREE.BackSide })); envScene.add(gnd);
const dayEnv = pmrem.fromScene(envScene, 0.02).texture;
const nightEnvScene = new THREE.Scene(); nightEnvScene.background = new THREE.Color(0x0a1022);
const glow = new THREE.Mesh(new THREE.SphereGeometry(14000, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0x2a2418, side: THREE.BackSide })); nightEnvScene.add(glow);
const nightEnv = pmrem.fromScene(nightEnvScene).texture;
scene.environment = dayEnv;

const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
sun.position.copy(sunDir).multiplyScalar(1200); sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -500, right: 500, top: 600, bottom: -600, near: 10, far: 3000 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x4d4a40, 0.35); scene.add(hemi);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshStandardMaterial({ color: 0x8c8b84, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const models = {};
function show(name){
  for (const k in models) models[k].group.visible = k === name;
  const v = VIEWS[name];
  camera.position.set(...v.cam); controls.target.set(...v.target); controls.update();
  sun.target.position.set(...v.target); sun.position.copy(sunDir).multiplyScalar(1200).add(sun.target.position);
  for (const b of document.querySelectorAll('#ui button[data-m]')) b.classList.toggle('on', b.dataset.m === name);
}
const VIEWS = {
  petronas: { cam: [420, 120, 470], target: [10, 200, -13] },
  merdeka: { cam: [-2050, 45, 1080], target: [-1928, 22, 1010] },
  x106: { cam: [1250, 260, 2150], target: [775, 260, 1775] },
  jamek: { cam: [-1700, 40, 1060], target: [-1780, 8, 989] },
  m118: { cam: [-850, 260, 2250], target: [-1219, 320, 1780] },
  kltower: { cam: [-700, 230, 760], target: [-883, 250, 546] },
};
models.petronas = buildPetronas(); scene.add(models.petronas.group);
try { models.x106 = buildX106(); scene.add(models.x106.group); } catch (e) { console.warn('x106', e); }
try { models.jamek = buildJamek(); scene.add(models.jamek.group); } catch (e) { console.warn('jamek', e); }
try { models.m118 = buildMerdeka118(); scene.add(models.m118.group); } catch (e) { console.warn('m118', e); }
try { models.kltower = buildKLTower(); scene.add(models.kltower.group); } catch (e) { console.warn('kltower', e); }
try { models.merdeka = buildMerdeka(); scene.add(models.merdeka.group); } catch (e) { console.warn('merdeka', e); }

let night = false;
function setNight(on){
  night = on;
  scene.environment = on ? nightEnv : dayEnv;
  sky.visible = !on; scene.background = on ? new THREE.Color(0x070b18) : null;
  sun.intensity = on ? 0 : 3.2; hemi.intensity = on ? 0.06 : 0.35;
  renderer.toneMappingExposure = on ? 0.9 : 0.55;
  for (const k in models) models[k].setNight?.(on);
}
const ui = document.getElementById('ui');
const btn = (label, fn, m) => { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; if (m) b.dataset.m = m; ui.appendChild(b); return b; };
btn('Petronas', () => show('petronas'), 'petronas');
btn('Dataran Merdeka', () => show('merdeka'), 'merdeka');
btn('KL Tower', () => show('kltower'), 'kltower');
btn('Merdeka 118', () => show('m118'), 'm118');
btn('Masjid Jamek', () => show('jamek'), 'jamek');
btn('Exchange 106', () => show('x106'), 'x106');
btn('Day / Night', () => setNight(!night));
btn('Street view', () => { const t = controls.target; camera.position.set(t.x - 160, 1.7, t.z + 170); controls.target.set(t.x, t.y + 60, t.z); controls.update(); });
addEventListener('keydown', e => { if (e.code === 'KeyN') setNight(!night); });
const start = new URLSearchParams(location.search).get('m') || 'petronas';
show(models[start] ? start : 'petronas');
if (new URLSearchParams(location.search).get('night')) setNight(true);

window.__lab = { THREE, scene, camera, controls, renderer, show, setNight, models };
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => { const t = clock.getElapsedTime(); for (const k in models) models[k].update?.(t); controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
